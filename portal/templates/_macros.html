{% macro cmd(id, text, prompt='$') -%}
<div class="cmd"><code id="{{ id }}" data-prompt="{{ prompt }}">{{ text }}</code><button type="button" class="copy">{{ _("Copier") }}</button></div>
{%- endmacro %}

{% macro service(active) -%}
<span class="st {{ 'ok' if active else 'err' }}">{{ _('actif') if active else _('arrêté') }}</span>
{%- endmacro %}
