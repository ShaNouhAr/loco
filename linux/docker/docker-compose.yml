# loco en conteneur, depuis ce dossier (linux/docker) :
#   cp .env.example .env     puis renseigner au moins LOCO_HOST
#   docker compose up -d --build
#   docker compose logs loco     compte initial « admin » et empreinte de l'autorité HTTPS
#
# Réseau de l'hôte : le cache Windows Update écoute sur 80 et 443, et le filtrage par réseau
# (LOCO_ALLOW, LOCO_ADMIN_ALLOW) doit voir la vraie adresse des postes. Ne pas lancer en même temps
# qu'une installation native de loco sur la même machine (mêmes ports).
name: loco    # nom de projet fixe : mêmes volumes quel que soit le dossier
services:
  loco:
    build:
      context: ../..
      dockerfile: linux/docker/Dockerfile
    image: loco:latest
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOCO_HOST: ${LOCO_HOST:-}
      LOCO_HTTPS_PORT: ${LOCO_HTTPS_PORT:-8443}
      LOCO_PORTAL_URL: ${LOCO_PORTAL_URL:-}
      LOCO_HTTP_PORT: ${LOCO_HTTP_PORT:-8088}
      LOCO_HTTP: ${LOCO_HTTP:-1}
      LOCO_ALLOW: ${LOCO_ALLOW:-}
      LOCO_ADMIN_ALLOW: ${LOCO_ADMIN_ALLOW:-}
      LOCO_PROXY: ${LOCO_PROXY:-}
      LOCO_WU: ${LOCO_WU:-1}
      LOCO_WU_CACHE_SIZE: ${LOCO_WU_CACHE_SIZE:-}
      LOCO_RESOLVERS: ${LOCO_RESOLVERS:-}
      LOCO_FLATPAK: ${LOCO_FLATPAK:-1}
      LOCO_FLATPAK_CACHE_SIZE: ${LOCO_FLATPAK_CACHE_SIZE:-}
      LOCO_RPM: ${LOCO_RPM:-1}
      LOCO_RPM_CACHE_SIZE: ${LOCO_RPM_CACHE_SIZE:-}
      LOCO_MAX_UPLOAD: ${LOCO_MAX_UPLOAD:-}
      LOCO_BACKUP_KEEP: ${LOCO_BACKUP_KEEP:-3}
      LOCO_TLS_CERT: ${LOCO_TLS_CERT:-}
      LOCO_TLS_KEY: ${LOCO_TLS_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${LOCO_DATA_DIR:-loco-data}:/srv/loco
      - ${LOCO_BACKUP_DIR:-loco-backups}:/var/backups/loco
      - loco-state:/var/lib/loco
      - loco-etc:/etc/loco
      - loco-apt-cache:/var/cache/apt-cacher-ng
      - loco-logs:/var/log/nginx
      # Certificat d'entreprise (LOCO_TLS_CERT=/run/loco-tls/server.crt, LOCO_TLS_KEY=…/server.key) :
      # - ./tls:/run/loco-tls:ro
    # Seuls les droits utiles aux processus root (configuration, changement d'utilisateur, ports 80/443).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}

volumes:
  loco-data:
  loco-backups:
  loco-state:
  loco-etc:
  loco-apt-cache:
  loco-logs:
