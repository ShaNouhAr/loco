; Généré par install.sh (appliance Alpine) : OpenRC lance supervisord, qui lance le portail, nginx
; et les tâches périodiques. Journaux : /var/log/loco/.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/loco/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/run/loco-supervisord.pid

[unix_http_server]
file=/run/loco-supervisor.sock
chmod=0700
username=loco
password=@SUP_PASSWORD@

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/loco-supervisor.sock
username=loco
password=@SUP_PASSWORD@

[program:loco-portal]
command=@GUNICORN@ @GUNICORN_FLAGS@ --workers 1 --threads 8 --timeout 120 --bind 127.0.0.1:@APP_PORT@ --access-logfile - --access-logformat "%%(h)s %%(m)s %%(U)s %%(s)s" app:app
directory=/opt/loco/portal
user=loco
environment=HOME="/var/lib/loco",USER="loco",LOCO_DATA="@DATA@",LOCO_STATE="/var/lib/loco",LOCO_ETC="/etc/loco",LOCO_PUBLIC_URL="@HTTP_URL@",LOCO_ADMIN_URL="@ADMIN_URL@",LOCO_HOST="@HOST@",LOCO_ACNG_PORT="3142",LOCO_WU_PROXY_PORT="@WU_PROXY_PORT@",LOCO_BACKUP_DIR="@BACKUP_DIR@",LOCO_FLATPAK="@FLATPAK@",LOCO_RPM="@RPM@",LOCO_RUNTIME="alpine",TMPDIR="@DATA@/.tmp"@SUP_PROXY_ENV@
umask=022
priority=20
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/loco/portal.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/loco/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:loco-cron]
command=/usr/local/sbin/loco-cron
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/loco/cron.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

@SQUID_PROGRAM@
