name: CI
# Vérifications rapides à chaque push et pull request, sans machine virtuelle : lint, tests unitaires sur les bibliothèques
# de chaque distribution et parcours dans un navigateur.
# Les tests d'intégration (VM, Docker, ISO, Windows) sont dans integration.yml : ils tournent quand un push
# touche les installeurs ou les agents, et toujours avant une publication (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  checks:
    name: Vérifications (lint et tests unitaires)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Shell et Python
        run: |
          shellcheck -S style -x install.sh linux/install.sh linux/remove.sh linux/lib/*.sh linux/bin/* tests/*.sh linux/docker/*.sh linux/conf/loco-cron linux/conf/*.initd linux/conf/loco-issue.start linux/lxc/proxmox-lxc.sh portal/templates/setup.sh portal/templates/proxmox.sh portal/templates/flatpak-setup.sh portal/templates/rpm-setup.sh linux/iso/*.sh linux/iso/loco-installer windows/client/build.sh
          # Les bibliothèques embarquées restent intactes ; contrôler tout le code propre au projet.
          git ls-files 'portal/*.py' 'tests/*.py' linux/docker/migrate-env.py linux/iso/package.py \
            | grep -vE '^portal/agents/console/(pyte|wcwidth)/|^portal/loco/_vendor/' \
            | xargs pipx run pyflakes
          docker compose -f linux/docker/docker-compose.yml config -q
      - name: Paquets des tests unitaires
        uses: ./.github/actions/apt-install
        with:
          packages: python3-flask apt-utils gnupg createrepo-c rpm
      - name: Tests unitaires du portail (rapides, hors VM)
        run: python3 -W error::ResourceWarning -m unittest discover -s tests
      - name: PowerShell (syntaxe des scripts Windows)
        shell: pwsh
        run: |
          $errors = 0
          foreach ($file in Get-ChildItem windows, tests -Recurse -Filter *.ps1) {
              $found = $null
              [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$found)
              foreach ($e in $found) { Write-Host "$($file.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $errors++ }
              if ([IO.File]::ReadAllBytes($file.FullName)[0] -ne 0xEF) { Write-Host "$($file.FullName) : UTF-8 avec BOM requis (Windows PowerShell 5.1)"; $errors++ }
          }
          exit $errors
  libraries:
    name: Tests unitaires sur ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Versions de Python, Flask, Werkzeug et cryptography livrées par les distributions prises en charge : ce que la
        # plus récente accepte casse souvent sur la plus ancienne, et c'est bien plus rapide à voir ici que dans une VM.
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:26.04']
    env:
      LANG: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Paquets de la distribution
        run: |
          for attempt in 1 2 3; do
              apt-get update -q && apt-get install -y -q python3-flask apt-utils gnupg createrepo-c rpm git ca-certificates && exit 0
              sleep 20
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests unitaires (sans droits root, comme dans les VM)
        run: |
          useradd -m ci
          chown -R ci .
          runuser -u ci -- python3 -W error::ResourceWarning -m unittest discover -s tests
  browser:
    name: Parcours dans un vrai navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Paquets du portail
        uses: ./.github/actions/apt-install
        with:
          packages: python3-flask python3-venv apt-utils gnupg createrepo-c rpm
      - name: Playwright et Chromium
        run: |
          python3 -m venv --system-site-packages /tmp/browser
          /tmp/browser/bin/pip install --quiet playwright==1.64.1
          /tmp/browser/bin/playwright install --with-deps chromium
      - name: Scripts, direct, géométrie des pages et console
        run: /tmp/browser/bin/python3 tests/browser/test_ui.py
      - name: Captures des pages
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-captures
          path: test-results/browser/
          retention-days: 7
