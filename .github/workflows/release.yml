name: Release
# Push a vX.Y.Z tag to publish a release. Use Re-run in Actions to retry.
# A release uses the appliance ISO and Windows agent tested in the same run.
# Forks can publish their own releases using GITHUB_TOKEN.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  integration:
    # Start the integration VMs after the quick checks pass.
    needs: checks
    uses: ./.github/workflows/integration.yml
  publish:
    name: Publish
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loco-iso
          path: /tmp/loco-release-iso
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loco-client-msi
          path: /tmp/loco-release-msi
      - name: Verify the tag and collect the release artifacts
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $RELEASE_TAG"; exit 1; }
          revision=$(git rev-parse "$RELEASE_TAG^{commit}")
          test "$revision" = "$(git rev-parse HEAD)" || { echo "The run does not match tag $RELEASE_TAG"; exit 1; }
          version=${RELEASE_TAG#v}
          git show "$revision:portal/loco/config.py" | grep -qx "VERSION = \"$version\"" || { echo "VERSION in portal/loco/config.py does not match $version"; exit 1; }
          mkdir -p dist
          cp /tmp/loco-release-iso/alpine-build/loco-v3.24-x86_64.iso "dist/loco-$version-x86_64.iso"
          cp /tmp/loco-release-msi/loco-client.msi "dist/loco-client-$version.msi"
          git archive --format=tar.gz --prefix="loco-$version/" "$revision" > "dist/loco-$version.tar.gz"
          (cd dist && sha256sum loco-* > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          notes=$(mktemp)
          awk -v version="$version" '
            /^## / {
              if (found) exit
              found = ($2 == version)
              next
            }
            found && (written || NF) { print; written = 1 }
            END { if (!written) exit 1 }
          ' CHANGELOG.md > "$notes" || { echo "Missing English release notes for $version"; exit 1; }
          gh release create "$RELEASE_TAG" --verify-tag --title "loco $version" --notes-file "$notes" dist/*
