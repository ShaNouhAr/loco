# loco : connexions persistantes (WebSocket) transmises au relais du portail (loco/relay.py, local uniquement).
# Mêmes en-têtes que pour le portail : le relais rejoue chaque message vers la route HTTP habituelle.
proxy_pass http://127.0.0.1:@RELAY_PORT@;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto https;
proxy_buffering off;
# Chaque extrémité donne signe de vie toutes les 20 s au plus.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
