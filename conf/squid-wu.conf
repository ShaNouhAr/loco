# loco : proxy-cache Windows Update, atteint par le réglage proxy WinHTTP des postes (sans redirection DNS).
# Proxy HTTP des seuls postes autorisés (--allow) : le contenu immuable de Windows Update est mis en cache,
# le HTTPS est tunnelisé tel quel (CONNECT, jamais déchiffré). Généré par install.sh ; ne pas modifier à la main.
http_port @WU_PROXY_PORT@

# Postes autorisés à utiliser le proxy (mêmes réseaux que --allow).
@SQUID_SRC@
acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Jamais vers le serveur loco lui-même ni le lien local (services internes, métadonnées) : pas de rebond par le proxy.
acl loco_forbidden_dst dst 127.0.0.0/8 0.0.0.0/32 169.254.0.0/16 ::1 fe80::/10
http_access deny loco_forbidden_dst
http_access allow loco_clients
http_access deny all

# Cache : seuls les fichiers immuables de Windows Update (empreinte/GUID dans le nom) sont gardés longtemps.
cache_mem 256 MB
maximum_object_size 6144 MB
maximum_object_size_in_memory 1 MB
cache_dir ufs @DATA@/wuproxy @WU_PROXY_CACHE_MB@ 16 256
cache_effective_user @SQUID_USER@
range_offset_limit -1
quick_abort_min -1 KB
refresh_pattern -i \.(cab|msu|psf|esd|wim|appx|msix|exe|dll|bin|vhd)$ 259200 100% 259200 override-expire ignore-no-cache ignore-private ignore-reload
refresh_pattern .  0 20% 4320

visible_hostname loco-wu
httpd_suppress_version_string on
via off
forwarded_for delete
pid_filename /run/squid/squid-loco.pid
cache_log /var/log/squid/cache.log
access_log stdio:/var/log/squid/loco-wu.log squid
