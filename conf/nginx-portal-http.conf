
# HTTP (--http-port) : amorçage des postes qui ne font pas encore confiance à l'autorité locale.
# Ne sert que le dépôt APT (signé GPG), les installeurs (vérifiés SHA256), les scripts et paquets d'amorçage
# (protégés par la clé d'inscription) et ca.crt ;
# le reste redirige vers HTTPS. Désactivable avec --no-http.
server {
    listen @PORTAL_PORT@;
    listen [::]:@PORTAL_PORT@;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/loco-portal.log;

    location ^~ /apt/ {
        include snippets/loco-clients.conf;
        alias @DATA@/apt/;
        autoindex on;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    location ^~ /win/files/ {
        include snippets/loco-clients.conf;
        alias @DATA@/win/;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    @FLATPAK_LOCATIONS@

    @RPM_LOCATIONS@

    location = /ca.crt {
        include snippets/loco-clients.conf;
        alias /etc/loco/tls/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/(win/i/|linux/setup\.sh$|linux/repositories/[^/]+/[^/]+\.sources$|flatpak/setup\.sh$|rpm/setup\.sh$|flatpak/(loco|local-repo)\.flatpakrepo$|agent/(linux\.sh|windows\.ps1|loco-client\.(deb|rpm)|files/loco-client\.msi)$|healthz$) {
        include snippets/loco-clients.conf;
        include snippets/loco-proxy.conf;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 301 https://$host:@HTTPS_PORT@$request_uri;
    }
}
