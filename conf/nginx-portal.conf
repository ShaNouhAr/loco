# loco : interface HTTPS et fichiers des postes clients.
# Accès : snippets/loco-clients.conf (postes) et snippets/loco-admin.conf (interface),
# générés par install.sh à partir de --allow et --admin-allow.

# Journal d'accès sans les paramètres de l'adresse : les commandes d'inscription portent la clé d'inscription
# (…/agent/linux.sh?key=…), qui n'a pas à être écrite dans un journal. Sert aussi au bloc HTTP et au bloc SNI.
log_format loco_portal '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen @HTTPS_PORT@ ssl;
    listen [::]:@HTTPS_PORT@ ssl;
@HTTPS_OLD_LISTEN@
    server_name _;
    server_tokens off;

    # HTTP saisi sur le port HTTPS : conserver l'adresse et l'URL au lieu d'une erreur 400.
    error_page 497 =308 https://$host:@HTTPS_PORT@$request_uri;

    ssl_certificate     /etc/loco/tls/server.crt;
    ssl_certificate_key /etc/loco/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:loco_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size @MAX_UPLOAD@;
    access_log /var/log/nginx/loco-portal.log loco_portal;

    # --- postes clients
    location ^~ /apt/ {
        include snippets/loco-clients.conf;
        alias @DATA@/apt/;
        autoindex on;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    location ^~ /win/files/ {
        include snippets/loco-clients.conf;
        alias @DATA@/win/;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    @FLATPAK_LOCATIONS@

    @RPM_LOCATIONS@

    location = /ca.crt {
        include snippets/loco-clients.conf;
        # Faisceau des agents (autorité loco en tête, puis l'autorité d'entreprise), sinon l'autorité loco seule
        # (serveur Windows, ou avant le premier passage d'install.sh) : ces deux fichiers seulement.
        root /etc/loco/tls;
        try_files /trust.pem /ca.crt =404;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/(win/i/|linux/setup\.sh$|linux/repositories/[^/]+/[^/]+\.sources$|flatpak/setup\.sh$|rpm/setup\.sh$|flatpak/(loco|local-repo)\.flatpakrepo$|healthz$) {
        include snippets/loco-clients.conf;
        include snippets/loco-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Agent du parc (loco-client) : inscription, contacts et résultats, authentifiés par l'application.
    location ^~ /agent/ {
        include snippets/loco-clients.conf;
        include snippets/loco-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Canal persistant de l'agent (WebSocket) : le serveur le prévient d'une session ou d'une action, sans relevé à vide.
    # Sans relais (port pris, relais coupé), la réponse est une erreur et l'agent continue par /agent/api/remote.
    location = /agent/relay {
        include snippets/loco-clients.conf;
        include snippets/loco-relay.conf;
    }

    # --- interface d'administration et supervision
    # Session distante vue du navigateur, en connexion persistante (WebSocket) ; repli sur /fleet/session/<id>/io.
    location ~ ^/fleet/session/[0-9a-f]+/ws$ {
        include snippets/loco-admin.conf;
        include snippets/loco-relay.conf;
    }

    location /static/ {
        include snippets/loco-admin.conf;
        alias /opt/loco/portal/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        include snippets/loco-admin.conf;
        include snippets/loco-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
