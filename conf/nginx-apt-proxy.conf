# loco (serveurs Windows et Alpine) : cache APT par nginx, à la place d'apt-cacher-ng qui n'existe pas sur ces
# systèmes. Les postes l'utilisent comme proxy HTTP (Acquire::http::Proxy, port 3142), pour tout dépôt en HTTP ;
# seuls les fichiers des dépôts APT sont relayés, le reste est refusé (pas de proxy ouvert).

log_format loco_apt '$remote_addr [$time_local] "$request_method $http_host$uri" $status $body_bytes_sent $upstream_cache_status $upstream_addr';

proxy_cache_path @DATA@/aptcache levels=2:2 keys_zone=loco_apt:64m
                 inactive=180d max_size=@APT_CACHE_SIZE@ use_temp_path=off;

# Sortie vers les dépôts. Le poste demande du HTTP ; bien des réseaux ne le laissent plus sortir, alors que le HTTPS
# passe. Les dépôts connus pour répondre en HTTPS sont donc joints ainsi d'abord, les autres comme le poste l'a
# demandé ; si la première voie ne répond pas, l'autre est essayée. Les paquets restent vérifiés par APT (signatures) :
# la voie ne change rien à ce que le poste accepte.
map $http_host $loco_apt_way {
    hostnames;
    default                     http;
    deb.debian.org              https;
    security.debian.org         https;
    archive.debian.org          https;
    archive.ubuntu.com          https;
    security.ubuntu.com         https;
    ports.ubuntu.com            https;
    old-releases.ubuntu.com     https;
    ppa.launchpadcontent.net    https;
    packages.zorinos.com        https;
    archive.raspberrypi.com     https;
}
map $loco_apt_way $loco_apt_other {
    http    https;
    https   http;
}

# Requêtes adressées au serveur lui-même (et non à un dépôt) : refusées, ce qui évite toute boucle.
map $host $loco_apt_self {
    hostnames;
    default     0;
    @APT_SELF_HOSTS@
}

server {
    listen @ACNG_PORT@;
    server_name _;
    server_tokens off;
    include snippets/loco-clients.conf;
    access_log @LOGDIR@/loco-apt.log loco_apt;

    resolver @DNS@ ipv6=off valid=300s;
    resolver_timeout 10s;

    proxy_cache loco_apt;
    proxy_cache_key $http_host$uri;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10m;
    proxy_cache_lock_age 10m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # Première voie : délai court, pour passer vite à l'autre quand le réseau la bloque sans répondre.
    proxy_connect_timeout 5s;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 8s;
    proxy_read_timeout 300s;
    # Sortie en HTTPS : le certificat du dépôt est vérifié contre les autorités du système.
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate @CA_BUNDLE@;
    add_header X-Loco-Cache $upstream_cache_status always;

    if ($loco_apt_self) {
        return 403;
    }

    # Index publiés par empreinte : immuables.
    location ~ "/by-hash/" {
        proxy_cache_valid 200 365d;
        error_page 502 504 = @hash_other_way;
        proxy_pass $loco_apt_way://$http_host$request_uri;
    }
    # Index (Release, Packages…) : courte durée, revalidés auprès du dépôt. Jamais de copie périmée quand le dépôt ne
    # répond pas : un index dont la date de validité est passée ferait échouer tout « apt-get update » du poste, alors
    # qu'un échec net lui laisse ses listes et le reste de ses dépôts. Pas de reprise partielle non plus (réponses 416).
    location ~ "/dists/" {
        proxy_cache_valid 200 2m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale off;
        max_ranges 0;
        error_page 502 504 = @dists_other_way;
        proxy_pass $loco_apt_way://$http_host$request_uri;
    }
    # Paquets et sources : un nom par version, gardés longtemps.
    location ~ "\.(deb|udeb|ddeb|dsc|diff\.gz|tar\.(gz|xz|bz2|lzma|zst))$" {
        proxy_cache_valid 200 365d;
        error_page 502 504 = @pool_other_way;
        proxy_pass $loco_apt_way://$http_host$request_uri;
    }
    # Seconde voie, quand la première n'a pas répondu (mêmes règles de cache, même clé).
    location @hash_other_way {
        proxy_cache_valid 200 365d;
        proxy_connect_timeout 10s;
        proxy_pass $loco_apt_other://$http_host$request_uri;
    }
    location @dists_other_way {
        proxy_cache_valid 200 2m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale off;
        max_ranges 0;
        proxy_connect_timeout 10s;
        proxy_pass $loco_apt_other://$http_host$request_uri;
    }
    location @pool_other_way {
        proxy_cache_valid 200 365d;
        proxy_connect_timeout 10s;
        proxy_pass $loco_apt_other://$http_host$request_uri;
    }
    location / {
        return 403;
    }
}
